<!DOCTYPE html>
<html>
<head>
<title>Task Details</title>

<style>

body{
    font-family:Segoe UI;
    background:#f5f7fb;
    padding:40px;
}

.card{
    background:white;
    padding:30px;
    border-radius:20px;
    max-width:800px;
    margin:auto;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h2{
    color:#2563eb;
    margin-bottom:20px;
}

.row{
    margin-bottom:15px;
}

label{
    font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

    <h2>📋 Daily Plan Details</h2>

    <div id="details"></div>
<br>
<button onclick="updateTask()">✏️ Update</button>
<button onclick="deleteTask()">🗑️ Delete</button>
<button onclick="exportExcel()">📊 Export Excel</button>
</div>


<script>

const params = new URLSearchParams(window.location.search);
const date = params.get("date");

let data = JSON.parse(localStorage.getItem(date));

if(data){

document.getElementById("details").innerHTML = `

<div class="row">
<label>Project Name</label><br>
<input type="text" id="project" value="${data.project}">
</div>

<br>

<div class="row">
<label>Employee Name</label><br>
<input type="text" id="employee" value="${data.employee}">
</div>

<br>

<div class="row">
<label>Date</label><br>
<input type="date" id="taskDate" value="${data.date}">
</div>

<br>

<div class="row">
<label>Task</label><br>
<input type="text" id="task" value="${data.task}">
</div>

<br>

<div class="row">
<label>Summary</label><br>
<textarea id="summary" rows="6">${data.summary}</textarea>
</div>
`;

}
else{

document.getElementById("details").innerHTML =
"<h3>No Task Found For Selected Date</h3>";

}

function updateTask(){

let updatedTask = {

project : document.getElementById("project").value,
employee : document.getElementById("employee").value,
date : document.getElementById("taskDate").value,
task : document.getElementById("task").value,
summary : document.getElementById("summary").value

};

localStorage.setItem(updatedTask.date,
JSON.stringify(updatedTask));

alert("Task Updated Successfully");

}

function deleteTask(){

if(confirm("Are you sure you want to delete this task?")){

localStorage.removeItem(date);

alert("Task Deleted Successfully");

window.location.href="planner.html";

}

}

function exportExcel(){

let csvContent =
"Project Name,Employee Name,Date,Task,Summary\n" +

`"${document.getElementById("project").value}",
"${document.getElementById("employee").value}",
"${document.getElementById("taskDate").value}",
"${document.getElementById("task").value}",
"${document.getElementById("summary").value}"`;

const blob = new Blob([csvContent],
{ type: "text/csv;charset=utf-8;" });

const link = document.createElement("a");

link.href = URL.createObjectURL(blob);

link.download =
"Task_" +
document.getElementById("taskDate").value +
".csv";

link.click();

}

</script>

</body>
</html>
